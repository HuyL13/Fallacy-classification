task: classification
data_dir: data/cocolofa
split: dev
context: paper
pipeline:
  route_mode: debate_all
  margin_threshold: 0.12 # Placeholder; selective gating requires dev tuning.
  article_max_chars: 6000
  variant: full
model:
  provider: openai_compatible
  name: Llama-3.3-70B-Instruct
  base_url: https://mkp-api.fptcloud.com/v1
