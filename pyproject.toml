[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocolofa-pard"
version = "0.1.0"
description = "Auditable PARD-inspired API baseline for the two original CoCoLoFa tasks"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2", "jsonschema==4.23.0"]

[project.optional-dependencies]
mgscd = ["pydantic==2.14.3"]
calibration = ["pydantic==2.14.3", "scikit-learn>=1.3,<2"]

[tool.setuptools.package-data]
"src.mgscd" = ["prompts/*.txt", "patterns/*.json"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_temp"
